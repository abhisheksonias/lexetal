<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Dynamic Resources</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold mb-8">Dynamic Resources Test</h1>
        
        <!-- Test Blog Grid -->
        <div class="mb-12">
            <h2 class="text-2xl font-bold mb-4">Blog Grid Test</h2>
            <div id="blog-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mb-12">
                <!-- Blog cards will be loaded dynamically here -->
            </div>
            <button id="load-more-blogs" class="bg-blue-500 text-white px-6 py-2 rounded">
                Load More Blogs
            </button>
        </div>

        <!-- Test Video Grid -->
        <div class="mb-12">
            <h2 class="text-2xl font-bold mb-4">Video Grid Test</h2>
            <div id="video-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mb-12">
                <!-- Video cards will be loaded dynamically here -->
            </div>
        </div>

        <!-- Test Featured Video -->
        <div class="mb-12">
            <h2 class="text-2xl font-bold mb-4">Featured Video Test</h2>
            <div class="max-w-4xl mx-auto">
                <div class="relative bg-black rounded-2xl overflow-hidden shadow-2xl">
                    <div class="aspect-video">
                        <iframe id="featured-video" src="https://www.youtube.com/embed/dQw4w9WgXcQ"
                            title="Featured Video" frameborder="0"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                            allowfullscreen class="w-full h-full">
                        </iframe>
                    </div>
                </div>
                <div class="mt-6 text-center">
                    <h3 class="text-2xl font-bold text-gray-900 mb-2">
                        Complete Guide to Tax Planning 2024
                    </h3>
                    <p class="text-gray-600">
                        Our comprehensive overview of tax planning strategies for the current year.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/resources-dynamic.js"></script>
</body>
</html>
